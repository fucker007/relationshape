[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "relationshape"
version = "0.1.0"
description = "随时间生长的关系-人格-情商引擎：为长期陪伴型 AI 提供结构化的每轮对话指令"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["relationshape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
