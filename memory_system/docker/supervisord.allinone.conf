[supervisord]
nodaemon=true
user=root

[program:postgresql]
command=/usr/lib/postgresql/PG_VERSION_PLACEHOLDER/bin/postgres -D /var/lib/postgresql/data -p PG_PORT_PLACEHOLDER
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql_err.log
priority=10

[program:redis]
command=redis-server --port 6379 --save 60 1000 --appendonly yes --dir /var/lib/redis
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis_err.log
priority=10

[program:embedding]
command=uvicorn embed:app --host 0.0.0.0 --port 8002
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/embedding.log
stderr_logfile=/var/log/supervisor/embedding_err.log
priority=20
startsecs=10

[program:memory-api]
command=uvicorn api.main:app --host 0.0.0.0 --port 8010 --workers 2
directory=/app/memory
environment=PYTHONPATH="/app/memory:/app"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api_err.log
priority=30
startsecs=5
