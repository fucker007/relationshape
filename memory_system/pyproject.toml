[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-system"
version = "0.1.0"
description = "Real-time person-centric memory system for chat AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "pgvector>=0.3.5",
    "anthropic>=0.40.0",
    "aiokafka>=0.11.0",
    "apscheduler>=3.10.4",
    "numpy>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "locust>=2.32.0",
    "ruff>=0.7.0",
]
