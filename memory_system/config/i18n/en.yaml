# ============================================================
# English Language Config — Memory System i18n
# ============================================================
# Loaded when MEMORY_LANG=en
# Each language is tuned independently

# ----------------------------------------------------------
# 1. Intent classification rules
#    Matched in order; first hit returns; no match → general
# ----------------------------------------------------------
intent_rules:
  identity:
    - "what(?:'s| is) my name"
    - "what(?:'s| is) your name"
    - 'my name'
    - 'how old'
    - 'birthday'
    - 'where .*live'
    - 'where .*from'
    - 'what .*do for work'
    - 'what .*job'
    - 'which school'
    - 'where .*study'

  person:
    - '\b(?:mom|dad|grandma|grandpa|brother|sister|friend|teacher|uncle|aunt)\b'
    - '(?:with|about|how is|how''s|what happened to)\s+[A-Z][a-z]+'

  event:
    - 'what happened'
    - 'what did .* do'
    - 'recently'
    - 'last (?:week|month|time|night|year)'
    - 'yesterday'
    - 'today'
    - 'when did'
    - 'what.*going on'
    - 'recent events'
    - 'tell me about .*(?:time|event|thing)'

  emotion:
    - 'how .*feel'
    - '\bfeeling\b'
    - '\bmood\b'
    - 'are you (?:happy|sad|okay|upset|angry)'
    - 'how .*doing emotionally'
    - 'cheer up'

  preference:
    - 'what .*(?:like|prefer|enjoy|love|hate)'
    - 'do you (?:like|enjoy|prefer|love|hate)'
    - '\bfavorite\b'
    - '\bhobbies\b'
    - "don't like"
    - '\bdislike\b'

  relationship:
    - '\bfriends\b'
    - 'who .* know'
    - '\brelationship\b'
    - 'close to'
    - '\bfamily\b'
    - 'social circle'
    - 'who .* close with'


# ----------------------------------------------------------
# 2. Person name extraction rules
# ----------------------------------------------------------
person_extraction:
  # Family titles (direct match, return lowercased)
  family_titles:
    - '\b(mom|dad|grandma|grandpa|brother|sister|uncle|aunt|grandmother|grandfather)\b'

  # English capitalized name after preposition
  name_after_preposition:
    pattern: '(?:with|about|to|and|from|how is|how''s|what happened to)\s+([A-Z][a-z]{1,15})'
    stopwords:
