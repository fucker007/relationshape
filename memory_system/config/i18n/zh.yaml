# ============================================================
# 中文语言配置 — Memory System i18n
# ============================================================
# 环境变量 MEMORY_LANG=zh 时加载此文件
# 每种语言独立调优，不混在一起

# ----------------------------------------------------------
# 1. Intent 分类规则
#    按顺序匹配，首个命中即返回；未命中任何规则 → general
# ----------------------------------------------------------
intent_rules:
  identity:
    - '你叫什么'
    - '我叫什么'
    - '我的名字'
    - '几岁'
    - '多大了'
    - '生日'
    - '在哪上学'
    - '几年级'
    - '住哪'

  person:
    - '小[明华红刚丽强美磊芳杰敏伟婷龙燕鹏]'
    - '妈妈|爸爸|爷爷|奶奶|姥姥|姥爷|哥哥|姐姐|弟弟|妹妹'
    - '.{1,4}老师'
    - '和.{1,4}(?:关系|怎么样|最近|发生|吵|打|玩)'

  event:
    - '发生了什么'
    - '最近.*?(?:干|做|发生)'
    - '上[周个].*?(?:干|做|发生)'
    - '昨天.*?(?:干|做)'
    - '今天.*?(?:干|做)'
    - '什么时候.*?(?:吵|打|玩)'
    - '上次.*?(?:什么时候|干了什么)'

  emotion:
    - '心情'
    - '开心吗'
    - '难过'
    - '情绪'
    - '最近.*?怎么样'
    - '还好吗'
    - '没事吧'

  preference:
    - '喜欢什么'
    - '爱好'
    - '喜欢吃'
    - '喜欢玩'
    - '最喜欢'
    - '讨厌什么'
    - '不喜欢什么'

  relationship:
    - '朋友'
    - '好友'
    - '认识谁'
    - '和谁.*?好'
    - '社交'
    - '谁.*?关系好'
    - '有什么朋友'


# ----------------------------------------------------------
# 2. 人名提取规则（按优先级顺序执行）
# ----------------------------------------------------------
person_extraction:
  # 家庭称谓（直接匹配返回）
  family_titles:
    - '妈妈|爸爸|爷爷|奶奶|姥姥|姥爷|哥哥|姐姐|弟弟|妹妹'

  # 名字+职业 模式
  name_with_role:
    pattern: '(?:和|跟|与)([^\s，。！？]{1,4}?(?:老师|医生|护士|警察|司机|工程师|设计师|经理|主任|校长))'
    blacklist: ["什么", "大家", "自己", "别人", "他们", "她们"]

  # 名字 + 关系动词 模式
  name_with_verb:
    pattern: '(?:和|跟|与|关于|问问)([^\s，。！？]{1,4}?)(?:的|怎么|关系|最近|吵|打|玩|发生)'
    blacklist: ["什么", "大家", "自己", "别人", "他们", "她们"]

  # "小X" 模式
  xiao_pattern: '(小[\u4e00-\u9fff])'


# ----------------------------------------------------------
# 3. Profile 摘要模板
# ----------------------------------------------------------
profile_template:
  # 各字段标签
  section_basic: "**基本信息**"
  section_likes: "**喜好**"
  section_dislikes: "**注意避免**"
  section_habits: "**习惯**"
  section_focus: "**近期关注**"
  section_social: "**社交圈**"

  # 字段前缀
  prefix_name: "姓名："
  prefix_age_suffix: "岁"
  prefix_birthday: "生日"

  # 分隔符
  separator: "、"
  separator_comma: "，"

  # 喜好溢出模板 (>10个)
  likes_overflow: "...（共{count}项）"

  # 社交圈格式
  social_recent: " 最近："
  social_likes: " | 喜欢："

  # 情绪图标
  sentiment_icons:
    negative: "⚠"
    positive: "✓"
    neutral: "·"
  sentiment_arrows:
    positive: "↑"
    negative: "↓"
    neutral: "→"


# ----------------------------------------------------------
# 4. Extract 提取配置
# ----------------------------------------------------------
extract:
  # SCHEMA CONTRACT — windowed_extractor.py 依赖以下字段
  # Event: type, turn_indices(必填), summary, event_type, action,
  #        participants, scene, time_expr, emotion, emotion_detail
  # Attribute: type, field, key, value, target
  # 若修改输出 schema，必须同步修改 parser。
  # 系统提示词
  system_prompt: |
    你是一个对话事件提取助手。给定对话历史，识别并提取事件，生成结构化记忆。

    ## 输入格式
    - context_turns: 背景轮次（已处理，仅供理解上下文）
    - target_turns: 目标轮次（需要提取的新内容，每轮有索引 idx）
    - user_name: 主用户姓名
    - existing_events: 已记录的事件摘要列表（避免重复提取）

    ## 去重规则（最重要）
    - existing_events 中已记录的事件，不要重复提取
    - 如果 target_turns 是对已有事件的补充、延续或细化，不要创建新事件，直接跳过
    - 只提取 existing_events 中完全没有覆盖的新事件或新属性

    ## 提取规则

    ### 事件 — 判定框架

    对话内容满足以下任一测试即应提取为事件：

    1. **情节测试**：是否描述了一个具体的经历——发生了什么 + 谁/在哪/什么时候至少之一？任何有具体细节的活动、体验或计划都算。

    2. **社交关系测试**：是否涉及与他人的互动、协作或共同活动——无论过去、现在还是计划中？任何人际交往都算。

    3. **情感重要性测试**：是否有情感分量、个人意义或描述了生活变化？对某个经历的感受表达也算。

    4. **未来参考测试**：用户将来会不会希望系统记住这件事？如果未来对话可能引用到，现在就提取。

    重要 — 设定低阈值，宽泛提取：
    - 任何兴趣爱好、技能、休闲活动 → 提取
    - 任何用户分享的经历或询问的体验 → 提取
    - 任何计划、意向、安排 → 提取
    - 任何个人故事、趣事、过往经历 → 提取
    - 嵌入真实活动的问句也算（询问某人的练习进度/经历，说明有真实进行中的活动）
    - 多轮对话讨论同一件事时，合并为一个事件

    排除：纯抽象观点（无任何具体行动或场景）、关于 AI 本身的元问题、系统指令。

    参与者规则：
    - role=assistant 的发言者是 AI 助手/机器人，不是真人，不要列入 participants
    - user_name 是用户自己，也不要列入 participants（系统会自动添加）
    - participants 只填对话中提到的第三方真实人物

    重大生活事件必须提取：
    分手、离婚、离职、生病、受伤、考试失败、搬家、住院、亲人去世

    ### 属性（稳定特征，不是动作）
    - identity：基本身份（name, age, gender, job, school, location）
      信号词："我是……"、"我在……工作"、"我住在……"
    - preference：喜好（"我喜欢/爱/乐意……"）
    - aversion：厌恶（"我讨厌/不喜欢/受不了……"）
    - behavior：习惯（"我经常/总是/一般……"）
    - personality：性格（"我比较/倾向于……"）
    - relationship：人际关系（"XX是我的朋友/同事/邻居"）

    ## 输出格式
    返回 JSON 数组：
    ```json
    [
      {
        "type": "event",
        "turn_indices": [2, 3, 4],
        "summary": "使用与原始对话相同的语言，写完整的一两句话，15-50字，保留关键细节（谁、做了什么、在哪、什么时候）。主体是用户自己时可省略主语。",
        "event_type": "social|conflict|achievement|emotional|change|daily",
        "action": "核心动作（最多10字）",
        "participants": ["只填对话中提到的第三方真人"],
        "scene": "地点或null",
        "time_expr": "时间表达或null",
        "emotion": "positive|negative|neutral|mixed",
        "emotion_detail": "具体情绪或null"
      },
      {
        "type": "attribute",
        "field": "identity|preference|aversion|behavior|personality|relationship",
        "key": "字段名",
        "value": "值",
        "target": "self或人名"
      }
    ]
    ```

    summary 要求：
    - 使用与原始对话相同的语言（中文对话用中文）
    - 必须是完整的一两句话，保留关键细节
    - 用户自己做的事可以省略主语；他人的事保留原始主语
    - 尽量保留具体内容（人名、地点、时间、细节）
    - 格式："[动作短语] + [和谁/在哪/什么时候] + [结果或细节]"

    示例（展示提取粒度和形式，不限于特定领域）：
    - "周末参加了社区组织的手工坊，学了一门新手艺。"
    - "最近在练一种新乐器，虽然沮丧但决心坚持练下去。"
    - "带家人的宠物去公园散步，聊起了以前的回忆。"
    - "和朋友讨论了下次户外团建的安排——谁带什么东西、怎么拼车、几点出发。"
    - "分享了小时候和长辈一起做手工的故事，想重新捡起这个爱好。"
    - "联系了一个遇到困难的朋友，安慰对方并约了见面。"
    - "在家尝试了一道新菜，打算下次聚餐再做一次。"
    - "问了朋友最近练习某项技能的进展，持续关心对方。"

    turn_indices 是必填字段：填入 target_turns 中与该事件对应的 idx 值。

    仅当对话中完全没有任何具体活动、计划、经历或个人细节时，才返回空数组 `[]`。

  # 关键生活事件白名单（强制提取，不依赖 LLM）
  critical_keywords:
    - "分手"
    - "离婚"
    - "失业"
    - "下岗"
    - "住院"
    - "去世"
    - "死"
    - "搬家"
    - "退学"
    - "开除"
    - "怀孕"
    - "结婚"
    - "车祸"
    - "地震"

  # 情绪检测关键词（用于 critical_keywords 命中时的情绪推断）
  emotion_keywords:
    sad: ["分手", "离婚", "失业", "下岗", "住院", "去世", "死"]
    angry: ["吵架", "打架", "开除"]
    fearful: ["车祸", "地震", "住院"]

  # 默认动作标签
  critical_action: "关键事件"

  # summary 语言指令（嵌入 prompt 末尾）
  summary_language_instruction: "请用中文撰写 summary。"

  # 参与者黑名单（代词、泛称、AI 名称等）
  participant_blacklist:
    - "他"
    - "她"
    - "它"
    - "我"
    - "我们"
    - "他们"
    - "她们"
    - "大家"
    - "有人"
    - "别人"
    - "用户"
    - "助手"
    - "机器人"
    - "小嗨"
    - "AI"
    - "人工智能"
    - "语音助手"
    - "小爱"
    - "小度"
    - "天猫精灵"
    - "siri"
    - "Siri"

  # 参与者中文过滤词（包含这些词的参与者名会被过滤）
  participant_filter_words:
    - "可能"
    - "应该"
    - "会"
    - "各自"
    - "相互"
    - "一起"
    - "更"
    - "很"
    - "非常"
    - "特别"

  # 参与者中文语气助词（短名字含这些字会被过滤）
  participant_filter_particles:
    - "的"
    - "了"
    - "着"
    - "过"
    - "吗"
    - "呢"
    - "吧"
    - "啊"


